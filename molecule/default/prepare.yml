---
- name: Prepare Plex Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated for Plex Molecule tests preparation
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts["os_family"] == 'Debian'

    - name: Ensure required packages are installed for Plex Molecule tests preparation
      ansible.builtin.package:
        name:
          - python3-requests
          # The nested Docker daemon below stores its images through
          # fuse-overlayfs, which needs the binary to be present.
          - fuse-overlayfs
        state: present

    - name: Ensure Docker is installed for Plex Molecule tests preparation
      ansible.builtin.include_role:
        name: ansible-role-docker
      vars:
        docker_daemon_options:
          storage-driver: fuse-overlayfs

    # The role connects the container to the networks listed in
    # `plex_container_additional_networks` but deliberately does not create
    # them, so an inert implementation of that variable would go unnoticed
    # unless the network exists and can be checked for afterwards.
    - name: Ensure the extra container network for Plex Molecule tests exists
      ansible.builtin.command:
        cmd: "docker network create {{ plex_molecule_extra_network }}"
      register: plex_molecule_extra_network_result
      changed_when: plex_molecule_extra_network_result.rc == 0
      failed_when: >-
        plex_molecule_extra_network_result.rc != 0
        and 'already exists' not in plex_molecule_extra_network_result.stderr

    # Read back from inside the container later on, which is the only way to
    # tell a `plex_container_additional_volumes` entry that became a real
    # `--mount` from one that was silently dropped.
    - name: Ensure the extra bind-mount source for Plex Molecule tests exists
      ansible.builtin.file:
        path: "{{ plex_molecule_extra_volume_host_path }}"
        state: directory
        mode: "0755"

    - name: Ensure the extra bind-mount source for Plex Molecule tests holds a marker
      ansible.builtin.copy:
        content: "{{ plex_molecule_extra_volume_marker }}\n"
        dest: "{{ plex_molecule_extra_volume_host_path }}/marker"
        mode: "0644"
